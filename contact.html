<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>お問い合わせ・協賛のご案内｜職業人生ゲーム</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="site-header" class="site-header"></header>

  <main>
    <div class="page-header">
      <h1>お問い合わせ・協賛のご案内</h1>
      <p>イベントへの参加や協賛について、お気軽にご連絡ください。</p>
    </div>

    <section class="section">
      <div class="container prose">
        <h2>協賛のご案内</h2>
        <div class="card">
          <p>協賛金</p>
          <p class="price">1口 15,000円</p>
          <ul class="benefit-list">
            <li>職業カードの裏面に企業ロゴと紹介文を掲載します</li>
            <li>子どもたちにわかりやすい言葉で、事業内容や魅力を伝えます</li>
            <li>地元の親子に向けた認知度アップ・採用ブランディングの機会になります</li>
            <li>このサイトの「各地の協賛企業」ページに掲載します</li>
          </ul>
        </div>

        <h2>お問い合わせフォーム</h2>
        <div class="form-embed card">
          <iframe src="https://docs.google.com/forms/d/e/1FAIpQLSfTiD3aFvL4E648sovrdSvlRffPIRJu-kLLGPMNiMInuebyIw/viewform?embedded=true" title="お問い合わせフォーム" loading="lazy">読み込んでいます…</iframe>
        </div>
        <p class="form-embed-note">フォームが表示されない場合は<a href="https://docs.google.com/forms/d/e/1FAIpQLSfTiD3aFvL4E648sovrdSvlRffPIRJu-kLLGPMNiMInuebyIw/viewform" target="_blank" rel="noopener">こちらから開いてください</a>。</p>
      </div>
    </section>
  </main>

  <footer id="site-footer" class="site-footer"></footer>
  <script src="script.js"></script>
</body>
</html>
