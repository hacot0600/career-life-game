<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>よくある質問｜職業人生ゲーム</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="site-header" class="site-header"></header>

  <main>
    <div class="page-header">
      <h1>よくある質問</h1>
    </div>

    <section class="section">
      <div class="container prose faq">
        <details>
          <summary>何歳から遊べますか？</summary>
          <p>小学生とその保護者の方を対象にしています。親子で一緒にご参加ください。</p>
        </details>
        <details>
          <summary>どれくらい時間がかかりますか？</summary>
          <p>1回あたり15〜30分ほどです。</p>
        </details>
        <details>
          <summary>参加費はかかりますか？</summary>
          <p>イベントごとに異なります。各イベントの案内をご確認ください。</p>
        </details>
        <details>
          <summary>予約は必要ですか？</summary>
          <p>イベントごとに異なります。最新情報はInstagramでお知らせします。</p>
        </details>
        <details>
          <summary>企業として協賛するにはどうすればいいですか？</summary>
          <p><a href="contact.html">お問い合わせ・協賛のご案内</a>のページからご連絡ください。</p>
        </details>
      </div>
    </section>
  </main>

  <footer id="site-footer" class="site-footer"></footer>
  <script src="script.js"></script>
</body>
</html>
