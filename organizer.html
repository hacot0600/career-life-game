<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>主催団体｜職業人生ゲーム</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="site-header" class="site-header"></header>

  <main>
    <div class="page-header">
      <h1>主催団体</h1>
      <p>職業人生ゲームを企画・運営しています。</p>
    </div>

    <section class="section">
      <div class="container prose">
        <h2>AporTar</h2>
        <p><span class="placeholder-note">団体紹介文は仮です</span></p>
        <p>AporTarの紹介文が入ります。どんな団体で、どんな想いで活動しているのかを書きます。</p>

        <h2>メンバー</h2>
        <div class="card">
          <p><span class="placeholder-note">掲載してよいメンバー情報を確認中です</span></p>
          <p>代表・メンバーの紹介が入ります。</p>
        </div>

        <h2>SNS</h2>
        <p>活動の様子はInstagramで発信しています。ページ下のリンクからご覧ください。</p>
      </div>
    </section>
  </main>

  <footer id="site-footer" class="site-footer"></footer>
  <script src="script.js"></script>
</body>
</html>
